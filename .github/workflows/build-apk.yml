name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and sync Capacitor
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi
          npx cap sync android
      - name: Decode Keystore
    run: |
      mkdir -p android/app
      echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/validadesmart-release.jks
      - name: Build Debug APK
    env:
      KEYSTORE_FILE: validadesmart-release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    working-directory: android
        run: |
          sed -i '/org\.gradle\.java\.home/d' gradle.properties || true
          sed -i '/org\.gradle\.java\.home/d' ~/.gradle/gradle.properties || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
        -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
        -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
        -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
        -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: validadesmart-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
